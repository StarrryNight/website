<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Life photo 3">
  <defs>
    <linearGradient id="g-life3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232325"/>
      <stop offset="60%" stop-color="#535356"/>
      <stop offset="100%" stop-color="#94949A"/>

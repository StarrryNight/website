<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Life photo 7">
  <defs>
    <linearGradient id="g-life7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1F21"/>
      <stop offset="60%" stop-color="#4A4A4D"/>
      <stop offset="100%" stop-color="#87878B"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Life photo 4">
  <defs>
    <linearGradient id="g-life4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="60%" stop-color="#414143"/>
      <stop offset="100%" stop-color="#787880"/>
    </linearGradient>
    <filter id="blur-life4"><feGaussianBlur stdDeviation="100"/></filter>
    <filter id="grain-life4">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g-life4)"/>
  <g filter="url(#blur-life4)"><circle cx="889" cy="881" r="384" fill="#414143" opacity="0.22" /><circle cx="367" cy="599" r="286" fill="#787880" opacity="0.29" /><circle cx="382" cy="572" r="368" fill="#191919" opacity="0.40" /><circle cx="2" cy="858" r="247" fill="#414143" opacity="0.43" /><circle cx="336" cy="788" r="414" fill="#787880" opacity="0.42" /></g>
  <rect width="1200" height="900" filter="url(#grain-life4)" opacity="0.5"/>
</svg>
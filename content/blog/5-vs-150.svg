  </defs>
  <rect width="1600" height="1200" fill="url(#g-blog2)"/>
  <g filter="url(#blur-blog2)"><circle cx="961" cy="307" r="408" fill="#414143" opacity="0.23" /><circle cx="28" cy="879" r="507" fill="#787880" opacity="0.20" /><circle cx="1026" cy="783" r="222" fill="#191919" opacity="0.39" /><circle cx="419" cy="257" r="565" fill="#414143" opacity="0.34" /><circle cx="798" cy="495" r="221" fill="#787880" opacity="0.50" /></g>
  <rect width="1600" height="1200" filter="url(#grain-blog2)" opacity="0.5"/>
</svg>
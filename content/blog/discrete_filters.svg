<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Blog cover 1">
  <defs>
    <linearGradient id="g-blog1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232325"/>
      <stop offset="60%" stop-color="#535356"/>
      <stop offset="100%" stop-color="#94949A"/>

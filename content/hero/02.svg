<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-label="Hero image 2">
  <defs>
    <linearGradient id="g-hero2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1F21"/>
      <stop offset="60%" stop-color="#4A4A4D"/>

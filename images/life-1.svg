<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Life photo 1">
  <defs>
    <linearGradient id="g-life1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1F21"/>
      <stop offset="60%" stop-color="#4A4A4D"/>
      <stop offset="100%" stop-color="#87878B"/>
    </linearGradient>
    <filter id="blur-life1"><feGaussianBlur stdDeviation="100"/></filter>
    <filter id="grain-life1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g-life1)"/>
  <g filter="url(#blur-life1)"><circle cx="1142" cy="508" r="291" fill="#4A4A4D" opacity="0.33" /><circle cx="298" cy="587" r="263" fill="#87878B" opacity="0.39" /><circle cx="969" cy="172" r="233" fill="#1F1F21" opacity="0.36" /><circle cx="771" cy="146" r="292" fill="#4A4A4D" opacity="0.38" /><circle cx="101" cy="73" r="190" fill="#87878B" opacity="0.54" /></g>
  <rect width="1200" height="900" filter="url(#grain-life1)" opacity="0.5"/>
</svg>
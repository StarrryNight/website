  </defs>
  <rect width="1200" height="900" fill="url(#g-life6)"/>
  <g filter="url(#blur-life6)"><circle cx="720" cy="230" r="306" fill="#3A3A3C" opacity="0.23" /><circle cx="21" cy="660" r="380" fill="#6E6E72" opacity="0.20" /><circle cx="769" cy="587" r="167" fill="#171718" opacity="0.39" /><circle cx="314" cy="193" r="424" fill="#3A3A3C" opacity="0.34" /><circle cx="598" cy="371" r="165" fill="#6E6E72" opacity="0.50" /></g>
  <rect width="1200" height="900" filter="url(#grain-life6)" opacity="0.5"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Life photo 6">
  <defs>
    <linearGradient id="g-life6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171718"/>
      <stop offset="60%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#6E6E72"/>
    </linearGradient>
    <filter id="blur-life6"><feGaussianBlur stdDeviation="100"/></filter>

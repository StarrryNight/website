<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Life photo 5">
  <defs>
    <linearGradient id="g-life5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101011"/>
      <stop offset="60%" stop-color="#333335"/>
      <stop offset="100%" stop-color="#666669"/>
    </linearGradient>
    <filter id="blur-life5"><feGaussianBlur stdDeviation="100"/></filter>
    <filter id="grain-life5">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g-life5)"/>
  <g filter="url(#blur-life5)"><circle cx="805" cy="106" r="406" fill="#333335" opacity="0.32" /><circle cx="121" cy="643" r="269" fill="#666669" opacity="0.20" /><circle cx="677" cy="261" r="204" fill="#101011" opacity="0.20" /><circle cx="1071" cy="685" r="431" fill="#333335" opacity="0.42" /><circle cx="777" cy="624" r="186" fill="#666669" opacity="0.29" /></g>
  <rect width="1200" height="900" filter="url(#grain-life5)" opacity="0.5"/>
</svg>
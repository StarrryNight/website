<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Life photo 2">
  <defs>
    <linearGradient id="g-life2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141415"/>
      <stop offset="60%" stop-color="#2E2E30"/>
      <stop offset="100%" stop-color="#5B5B5F"/>
    </linearGradient>
    <filter id="blur-life2"><feGaussianBlur stdDeviation="100"/></filter>
    <filter id="grain-life2">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g-life2)"/>
  <g filter="url(#blur-life2)"><circle cx="1057" cy="632" r="313" fill="#2E2E30" opacity="0.47" /><circle cx="735" cy="595" r="185" fill="#5B5B5F" opacity="0.54" /><circle cx="798" cy="806" r="330" fill="#141415" opacity="0.53" /><circle cx="513" cy="508" r="303" fill="#2E2E30" opacity="0.49" /><circle cx="285" cy="677" r="198" fill="#5B5B5F" opacity="0.34" /></g>
  <rect width="1200" height="900" filter="url(#grain-life2)" opacity="0.5"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-label="Hero image 1">
  <defs>
    <linearGradient id="g-hero1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171718"/>
      <stop offset="60%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#6E6E72"/>

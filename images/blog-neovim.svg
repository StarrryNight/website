      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#g-blog3)"/>
  <g filter="url(#blur-blog3)"><circle cx="848" cy="473" r="275" fill="#333335" opacity="0.46" /><circle cx="402" cy="402" r="437" fill="#666669" opacity="0.51" /><circle cx="154" cy="709" r="430" fill="#101011" opacity="0.20" /><circle cx="184" cy="807" r="224" fill="#333335" opacity="0.25" /><circle cx="795" cy="987" r="574" fill="#666669" opacity="0.49" /></g>
  <rect width="1600" height="1200" filter="url(#grain-blog3)" opacity="0.5"/>
</svg>